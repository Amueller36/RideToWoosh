name: Feature request / idea
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The problem it solves and how you'd use it.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Apps/devices it relates to, alternatives you considered, etc.
    validations:
      required: false
